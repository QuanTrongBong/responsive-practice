<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery Responsive</title>
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <main>
    <h1>Gallery thiên nhiên</h1>
    <p>4 ảnh trên màn hình rộng, 2 ảnh trên màn hình vừa và 1 ảnh trên điện thoại nhỏ.</p>
    <section class="gallery" aria-label="Thư viện ảnh">
      <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Hồ núi giữa khung cảnh thiên nhiên"></figure>
      <figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Dãy núi dưới bầu trời trong xanh"></figure>
      <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Hồ nước và núi xanh"></figure>
      <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Con đường xuyên qua khu rừng"></figure>
      <figure><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Ánh bình minh trên cánh đồng"></figure>
      <figure><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Đỉnh núi cao giữa mây trời"></figure>
      <figure><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Tán cây xanh trong rừng"></figure>
      <figure><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&amp;fit=crop&amp;w=700&amp;q=80" alt="Phong cảnh thiên nhiên rộng lớn"></figure>
    </section>
  </main>
</body>
</html>
